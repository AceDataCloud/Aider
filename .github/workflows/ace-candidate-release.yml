name: Ace candidate artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: PEP 440 candidate version (for example 0.86.3a20261019)
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'AceDataCloud/Aider'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build setuptools wheel 'setuptools_scm[toml]>=8'
      - name: Build Ace-owned artifacts only
        env:
          ACE_CANDIDATE_VERSION: ${{ inputs.version }}
        run: python scripts/build_ace_release.py --version "$ACE_CANDIDATE_VERSION" --out dist/ace
      - uses: actions/upload-artifact@v4
        with:
          name: ace-aider-candidate
          path: dist/ace/
